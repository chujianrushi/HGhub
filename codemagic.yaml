workflows:
  hghub-ios-unsigned:
    name: HGhub iOS unsigned
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22.23.4
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $HOME/.rustup

    scripts:
      - name: Install Node dependencies
        script: |
          node -v
          npm install -g pnpm@10.34.9
          pnpm -v
          pnpm install --frozen-lockfile

      - name: Install Rust iOS toolchain
        script: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi

          . "$HOME/.cargo/env"
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc -V
          cargo -V

      - name: Build unsigned iOS IPA
        script: |
          . "$HOME/.cargo/env"
          chmod +x scripts/build-ios-unsigned.sh
          ./scripts/build-ios-unsigned.sh 1.2.1

    artifacts:
      - artifacts/*.ipa
      - ios-build-session.log
